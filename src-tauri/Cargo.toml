[package]
name = "folio"
version = "0.1.0"
description = "A specialized PDF reader for English academic literature"
authors = ["MochiKage"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# `cargo run` must know which binary to use (ocr_smoke is a dev-only tool)
default-run = "folio"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Dev builds run the whole OCR pipeline (full-page bilinear rotation,
# per-line crops, word profiles) through unoptimized code — ~7x slower
# than release. opt-level 1 keeps incremental builds fast while closing
# most of that gap (float semantics are unchanged: same results).
[profile.dev]
opt-level = 1

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
# OCR: ONNX Runtime (load-dynamic — DLL loaded from resources/lib at startup).
# Pinned: rc.x versions are not semver-compatible with each other.
# rc.13 needs ORT >= 1.17 — we ship 1.23.2 (see resources/models/download.ps1).
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows-only: disable WebView2 browser accelerator keys (Ctrl+F / Ctrl+A
# / F5 …) so the app's own shortcuts reach the webview. Versions must match
# the ones tauri itself depends on (see Cargo.lock).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
